name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Triggers the workflow on push to the master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Shallow clone with history

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # LTS runtime for build

    - name: Install dependencies
      run: npm install

    - name: Build
      env:
        REACT_APP_ASSET_VERSION: ${{ github.sha }}
      run: npm run build

    - name: Deploy to GitHub Pages
      env:
        GH_PAGES_TOKEN: ${{ secrets.JQUERY_REACT }}
        TARGET_REPO: jquery404/jquery404.github.io
        TARGET_BRANCH: master
      run: |
        if [ -z "$GH_PAGES_TOKEN" ]; then
          echo "Missing secret JQUERY_REACT. Set a PAT with repo write access to jquery404/jquery404.github.io."
          exit 1
        fi
        TARGET_URL="https://x-access-token:${GH_PAGES_TOKEN}@github.com/${TARGET_REPO}.git"
        git clone --branch "$TARGET_BRANCH" "$TARGET_URL" dist-branch
        rsync -av --delete build/ dist-branch/
        cd dist-branch
        git config user.email "jquery404@gmail.com"
        git config user.name "jquery404"
        git remote set-url origin "$TARGET_URL"
        git remote -v
        git add .
        git diff --cached --quiet || git commit -m "deploy: update site build"
        git push origin "$TARGET_BRANCH"