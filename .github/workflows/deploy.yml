name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Triggers the workflow on push to the master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 2  # Shallow clone with history

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Specify the Node.js version to use

    - name: Install dependencies
      run: npm install

    - name: Build
      env:
        REACT_APP_ASSET_VERSION: ${{ github.sha }}
      run: npm run build

    - name: Deploy to GitHub Pages
      env:
        GH_PAGES_TOKEN: ${{ secrets.JQUERY_REACT }}
      run: |
        if [ -z "$GH_PAGES_TOKEN" ]; then
          echo "Missing secret JQUERY_REACT. Set a PAT with repo write access to jquery404/jquery404.github.io."
          exit 1
        fi
        git clone --branch master "https://x-access-token:${GH_PAGES_TOKEN}@github.com/jquery404/jquery404.github.io.git" dist-branch
        rsync -av --delete build/ dist-branch/
        cd dist-branch
        git config user.email "jquery404@gmail.com"
        git config user.name "jquery404"
        git add .
        git diff --cached --quiet || git commit -m "deploy: update site build"
        git push origin master
