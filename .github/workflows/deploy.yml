name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build browser KB + site
      env:
        REACT_APP_ASSET_VERSION: ${{ github.sha }}
        REACT_APP_AGENT_ENABLED: 'true'
        REACT_APP_AGENT_MODE: split
        REACT_APP_AGENT_GENERATE_URL: https://lm0utr1vmi.execute-api.ap-southeast-2.amazonaws.com
      run: npm run build

    - name: Deploy to GitHub Pages
      env:
        GH_PAGES_TOKEN: ${{ secrets.JQUERY_REACT }}
        TARGET_REPO: jquery404/jquery404.github.io
        TARGET_BRANCH: master
      run: |
        if [ -z "$GH_PAGES_TOKEN" ]; then
          echo "Missing secret JQUERY_REACT. Set a PAT with repo write access."
          exit 1
        fi

        TARGET_URL="https://x-access-token:${GH_PAGES_TOKEN}@github.com/${TARGET_REPO}.git"

        # Configure git identity
        git config --global user.email "jquery404@gmail.com"
        git config --global user.name "jquery404"

        # Create a brand-new orphan branch from the build output
        cd build
        git init
        git checkout --orphan "$TARGET_BRANCH"
        git add .
        git commit -m "deploy: update site build (${GITHUB_SHA::7})"

        # Force push — this is intentional for a Pages deploy target
        git push --force "$TARGET_URL" "$TARGET_BRANCH"
        echo "Deploy succeeded."